[package]
name = "pokko"
version = "0.1.0"
edition = "2021"
description = "CLI for managing Pokko CMS model schemas as code"
license = "MIT"

[[bin]]
name = "pokko"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
colored = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
dirs = "5"
toml = "0.8"
open = "5"
rand = "0.8"
