name: CLI

on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # CI: build + test on every push/PR
  # ---------------------------------------------------------------------------
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            "./target"
          key: ${{ runner.os }}-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Release: cross-compile binaries for all platforms on tag push
  # ---------------------------------------------------------------------------
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Install `cross` for Linux aarch64 cross-compilation
      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      # Determine binary name (add .exe for Windows)
      - name: Determine binary filename (Unix)
        if: runner.os != 'Windows'
        id: binary_unix
        run: |
          echo "name=pokko-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          cp target/${{ matrix.target }}/release/pokko pokko-${{ matrix.target }}

      - name: Determine binary filename (Windows)
        if: runner.os == 'Windows'
        id: binary_windows
        shell: pwsh
        run: |
          $name = "pokko-${{ matrix.target }}.exe"
          echo "name=$name" >> $env:GITHUB_OUTPUT
          Copy-Item "target/${{ matrix.target }}/release/pokko.exe" $name

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pokko-${{ matrix.target }}
          path: "./pokko-${{ matrix.target }}"
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pokko-${{ matrix.target }}
          path: "./pokko-${{ matrix.target }}.exe"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: create GitHub Release and attach all binaries
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p ./release-binaries
          find ./artifacts -type f -exec mv {} ./release-binaries/ \;
          ls -la ./release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-binaries/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
